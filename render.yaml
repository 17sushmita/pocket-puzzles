# Free Flask hosting; PostgreSQL is hosted separately on Supabase.
services:
  - type: web
    name: pocket-puzzles-flask
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        # Supabase Connect > Session pooler, port 5432, with sslmode=require.
        # Enter privately in Render; never commit the database password.
        sync: false
