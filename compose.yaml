name: pocket-puzzles
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: puzzles
      POSTGRES_DB: puzzles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_local.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - puzzle_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puzzles -d puzzles"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://puzzles:${POSTGRES_PASSWORD}@db:5432/puzzles
      SECRET_KEY: ${SECRET_KEY:?Run python scripts/setup_local.py first}
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
      PORT: "8000"
    ports:
      - "4173:8000"
volumes:
  puzzle_postgres:
